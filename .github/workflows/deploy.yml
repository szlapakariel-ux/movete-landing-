name: Deploy a GitHub Pages

on:
  # Publica al hacer push a la rama de trabajo.
  push:
    branches:
      - claude/serene-faraday-rlr9ai
  # Permite ejecutarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# Permite que el workflow escriba la rama gh-pages.
permissions:
  contents: write

# Un solo deploy a la vez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        env:
          # El sitio se sirve desde /<nombre-del-repo>/ en Pages.
          VITE_BASE: /movete-landing-/
        run: npm run build

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
